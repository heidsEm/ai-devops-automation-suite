<!doctype html>\n<html>\n<head>\n<meta charset=\"utf-8\">\n<title>HeyGen AC Batch Submitter</title>\n<style>\nbody{margin:0;background:#0b0b0c;color:#f4f4f5;font-family:Arial}\nheader,main{padding:24px}main{max-width:1280px;margin:auto}\n.card{background:#151517;border:1px solid #33333a;border-radius:14px;padding:18px;margin-bottom:16px}\n.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c12{grid-column:span 12}\nlabel{display:block;color:#a1a1aa;font-size:12px;font-weight:bold;text-transform:uppercase;margin-bottom:6px}\ninput,select,textarea{width:100%;box-sizing:border-box;background:#1f1f23;color:#fff;border:1px solid #33333a;border-radius:10px;padding:11px;font-size:14px}\ntextarea{min-height:80px}\nbutton{border:1px solid #fff;background:#fff;color:#000;border-radius:999px;padding:10px 15px;font-weight:bold;cursor:pointer;margin:4px 6px 4px 0}\nbutton.secondary{background:transparent;color:#fff;border-color:#33333a}\nbutton:disabled{opacity:.45}\ntable{width:100%;border-collapse:collapse;font-size:13px;min-width:1050px}th,td{border-bottom:1px solid #33333a;padding:10px;text-align:left;vertical-align:top}\nth{font-size:11px;color:#a1a1aa;background:#111113;text-transform:uppercase}\n.log{white-space:pre-wrap;background:#050506;border:1px solid #33333a;border-radius:12px;padding:12px;height:280px;overflow:auto;font-family:monospace;font-size:12px}\n</style>\n</head>\n<body>\n<header><h1>HeyGen Avatar Batch Submitter</h1></header>\n<main>\n<section class=\"card\">\n<h2>Inputs</h2>\n<div class=\"grid\">\n<div class=\"c3\"><label>HeyGen API Key</label><input id=\"apiKey\" type=\"password\"></div>\n<div class=\"c3\"><label>Template ID or URL</label><input id=\"templateId\"></div>\n<div class=\"c3\"><label>Audio API Variable</label><select id=\"audioVar\"><option value=\"\">Load variables first</option></select></div>\n<div class=\"c3\"><label>Text API Variable</label><select id=\"textVar\"><option value=\"\">None</option></select></div>\n<div class=\"c12\"><label>MP3/WAV Files</label><input id=\"mp3Files\" type=\"file\" accept=\".mp3,.wav,audio/mpeg,audio/wav\" multiple></div>\n</div>\n<br>\n<button id=\"startBtn\">Submit All</button>\n<button id=\"checkBtn\" class=\"secondary\">Check Status</button>\n</section>\n<section class=\"card\"><h2>Log</h2><div id=\"log\" class=\"log\"></div></section>\n</main>\n</body>\n</html>
