<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>HeyGen AC Batch Submitter</title>
<style>
body{margin:0;background:#0b0b0c;color:#f4f4f5;font-family:Arial}
header,main{padding:24px}main{max-width:1280px;margin:auto}
.card{background:#151517;border:1px solid #33333a;border-radius:14px;padding:18px;margin-bottom:16px}
.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:12px}.c3{grid-column:span 3}.c4{grid-column:span 4}.c12{grid-column:span 12}
label{display:block;color:#a1a1aa;font-size:12px;font-weight:bold;text-transform:uppercase;margin-bottom:6px}
input,select,textarea{width:100%;box-sizing:border-box;background:#1f1f23;color:#fff;border:1px solid #33333a;border-radius:10px;padding:11px;font-size:14px}
textarea{min-height:80px}
button{border:1px solid #fff;background:#fff;color:#000;border-radius:999px;padding:10px 15px;font-weight:bold;cursor:pointer;margin:4px 6px 4px 0}
button.secondary{background:transparent;color:#fff;border-color:#33333a}
button:disabled{opacity:.45}
table{width:100%;border-collapse:collapse;font-size:13px;min-width:1050px}th,td{border-bottom:1px solid #33333a;padding:10px;text-align:left;vertical-align:top}
th{font-size:11px;color:#a1a1aa;background:#111113;text-transform:uppercase}
.log{white-space:pre-wrap;background:#050506;border:1px solid #33333a;border-radius:12px;padding:12px;height:280px;overflow:auto;font-family:monospace;font-size:12px}
</style>
</head>
<body>
<header><h1>HeyGen Avatar Batch Submitter</h1></header>
<main>
<section class="card">
<h2>Inputs</h2>
<div class="grid">
<div class="c3"><label>HeyGen API Key</label><input id="apiKey" type="password"></div>
<div class="c3"><label>Template ID or URL</label><input id="templateId"></div>
<div class="c3"><label>Audio API Variable</label><select id="audioVar"><option value="">Load variables first</option></select></div>
<div class="c3"><label>Text API Variable</label><select id="textVar"><option value="">None</option></select></div>
<div class="c12"><label>MP3/WAV Files</label><input id="mp3Files" type="file" accept=".mp3,.wav,audio/mpeg,audio/wav" multiple></div>
</div>
<br>
<button id="startBtn">Submit All</button>
<button id="checkBtn" class="secondary">Check Status</button>
</section>
<section class="card"><h2>Log</h2><div id="log" class="log"></div></section>
</main>
</body>
</html>
