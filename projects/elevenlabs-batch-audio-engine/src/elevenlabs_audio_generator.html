<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>CRP · ElevenLabs Audio Generator</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg:#0d0f0f; --surface:#141717; --border:#252a2a; --border2:#1e2424;
    --accent:#c8f542; --accent2:#89d62b; --muted:#4a5555; --text:#d8e4e4;
    --text2:#8a9e9e; --danger:#ff5f57; --warn:#ffbc2e; --ok:#28ca42;
    --mono:'IBM Plex Mono', monospace; --sans:'DM Sans', sans-serif; --r:6px;
  }
  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }
  body {
    background:var(--bg); color:var(--text); font-family:var(--sans); font-size:14px;
    min-height:100vh; display:flex; flex-direction:column; align-items:center;
    padding:32px 16px 64px;
  }
  .wrap { position:relative; z-index:1; width:100%; max-width:820px; display:flex; flex-direction:column; gap:20px; }
  header { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; padding-bottom:20px; border-bottom:1px solid var(--border); }
  .logo-block { display:flex; flex-direction:column; gap:4px; }
  .logo { font-family:var(--mono); font-size:11px; font-weight:600; letter-spacing:.12em; color:var(--accent); text-transform:uppercase; }
  h1 { font-family:var(--mono); font-size:22px; font-weight:600; color:var(--text); letter-spacing:-.01em; line-height:1.2; }
  h1 span { color:var(--accent); }
  .badge { font-family:var(--mono); font-size:10px; font-weight:500; letter-spacing:.1em; padding:3px 8px; border-radius:3px; border:1px solid var(--accent); color:var(--accent); background:#c8f54210; text-transform:uppercase; white-space:nowrap; }
  .card { background:var(--surface); border:1px solid var(--border); border-radius:var(--r); padding:20px; }
  .card-title { font-family:var(--mono); font-size:10px; font-weight:600; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .card-title::after { content:''; flex:1; height:1px; background:var(--border); }
  label { font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--text2); display:block; margin-bottom:6px; text-transform:uppercase; }
  input[type="text"], input[type="password"], select, textarea {
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:var(--r);
    color:var(--text); font-family:var(--mono); font-size:13px; padding:10px 12px; outline:none;
    transition:border-color .15s; appearance:none;
  }
  input[type="text"]:focus, input[type="password"]:focus, select:focus, textarea:focus { border-color:var(--accent); }
  textarea { resize:vertical; min-height:240px; line-height:1.6; font-size:12.5px; }
  .field { margin-bottom:16px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  .row3 { display:grid; grid-template-columns:1fr 1fr 1fr; gap:14px; }
  .voice-grid { display:grid; grid-template-columns:1fr; gap:12px; }
  .voice-slot { display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; }
  .voice-actions { display:flex; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .small-btn {
    background:transparent; border:1px solid var(--accent); border-radius:var(--r); color:var(--accent);
    font-family:var(--mono); font-size:12px; font-weight:600; letter-spacing:.06em; text-transform:uppercase;
    cursor:pointer; padding:9px 12px; transition:background .15s, color .15s, opacity .15s;
  }
  .small-btn:hover:not(:disabled) { background:var(--accent); color:#0d0f0f; }
  .remove-voice-btn { min-width:38px; height:38px; justify-content:center; font-size:18px; padding:0 10px; }
  .output-list { display:flex; flex-direction:column; gap:16px; }
  .output-item { background:var(--bg); border:1px solid var(--border); border-radius:var(--r); padding:14px; display:flex; flex-direction:column; gap:10px; }
  .output-head { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:8px; font-family:var(--mono); font-size:11px; color:var(--text2); }
  .slider-row { display:flex; align-items:center; gap:10px; }
  input[type="range"] { flex:1; accent-color:var(--accent); height:4px; cursor:pointer; }
  .slider-val { font-family:var(--mono); font-size:12px; color:var(--accent); min-width:38px; text-align:right; }
  .hint { font-size:11px; color:var(--text2); line-height:1.6; margin-top:6px; }
  .key-row { display:flex; gap:8px; }
  .icon-btn { background:var(--border); border:1px solid var(--border2); border-radius:var(--r); color:var(--text2); cursor:pointer; padding:0 12px; font-size:16px; display:flex; align-items:center; }
  .btn-generate { width:100%; padding:14px; background:var(--accent); color:#0d0f0f; border:none; border-radius:var(--r); font-family:var(--mono); font-size:13px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; cursor:pointer; }
  .btn-generate:hover:not(:disabled) { background:var(--accent2); }
  .toggle-row { display:flex; align-items:center; gap:10px; }
  .toggle-label { font-size:11px; font-weight:500; letter-spacing:.04em; color:var(--text2); text-transform:uppercase; }
  .toggle { position:relative; width:38px; height:20px; cursor:pointer; }
  .toggle input { opacity:0; width:0; height:0; }
  .toggle-track { position:absolute; inset:0; background:var(--border); border-radius:99px; }
  .toggle input:checked + .toggle-track { background:var(--accent); }
  .toggle-thumb { position:absolute; top:3px; left:3px; width:14px; height:14px; background:#fff; border-radius:50%; transition:transform .2s; }
  .toggle input:checked ~ .toggle-thumb { transform:translateX(18px); }
  .log-box { background:var(--bg); border:1px solid var(--border); border-radius:var(--r); padding:14px; font-family:var(--mono); font-size:12px; color:var(--text2); min-height:80px; max-height:220px; overflow-y:auto; display:none; }
  .log-box.visible { display:block; }
  .progress-wrap { height:3px; background:var(--border); border-radius:99px; overflow:hidden; display:none; margin-bottom:14px; }
  .progress-wrap.visible { display:block; }
  .progress-bar { height:100%; background:var(--accent); border-radius:99px; width:0%; transition:width .4s ease; }
  .output-card { display:none; flex-direction:column; gap:14px; }
  .output-card.visible { display:flex; }
  .audio-player { width:100%; border-radius:var(--r); accent-color:var(--accent); }
  .btn-dl { display:flex; align-items:center; justify-content:center; gap:8px; padding:11px 18px; background:transparent; border:1px solid var(--accent); border-radius:var(--r); color:var(--accent); font-family:var(--mono); font-size:12px; font-weight:600; text-decoration:none; }
  .btn-dl:hover { background:var(--accent); color:#0d0f0f; }
  .stats-row { display:flex; flex-wrap:wrap; gap:8px; }
  .stat { background:var(--border2); border:1px solid var(--border); border-radius:4px; padding:4px 10px; font-family:var(--mono); font-size:11px; color:var(--text2); }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo-block">
      <span class="logo">Enterprise Automation Engine</span>
      <h1>ElevenLabs <span>Batch</span> Audio Generator</h1>
    </div>
    <span class="badge">Batch TTS</span>
  </header>
  <div class="card">
    <div class="card-title">ElevenLabs Connection</div>
    <div class="field">
      <label>API Key</label>
      <div class="key-row">
        <input type="password" id="apiKey" placeholder="sk-… (stored in memory only)" autocomplete="off" />
        <button class="icon-btn" id="toggleKey" type="button">👁</button>
      </div>
    </div>
    <div class="field">
      <label>Custom Voice IDs — Dynamic Outputs</label>
      <div class="voice-grid" id="voiceGrid"></div>
      <div class="voice-actions">
        <button class="small-btn" id="addVoiceBtn" type="button">+ Add Voice</button>
        <button class="small-btn" id="removeVoiceBtn" type="button">− Remove Voice</button>
      </div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Post-Process Speed Variants</div>
    <div class="field">
      <label>Speed-Up Variants After ElevenLabs</label>
      <input type="text" id="postSpeedRates" value="1.15, 1.20, 1.30" />
      <div class="hint">Use multipliers: 1.15 = 15% faster, 1.20 = 20% faster, 1.30 = 30% faster.</div>
    </div>
  </div>
  <div class="card">
    <div class="card-title">Script Input &amp; Generate</div>
    <div class="field">
      <label>Paste Script</label>
      <textarea id="scriptInput" placeholder="Paste your script here…"></textarea>
    </div>
    <div class="progress-wrap" id="progressWrap"><div class="progress-bar" id="progressBar"></div></div>
    <div class="log-box" id="logBox"></div>
    <button class="btn-generate" id="generateBtn" onclick="generate()">Generate Audio</button>
  </div>
  <div class="card output-card" id="outputCard">
    <div class="card-title">Outputs</div>
    <div class="output-list" id="outputList"></div>
  </div>
</div>
</body>
</html>
