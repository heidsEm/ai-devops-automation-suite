<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Script → OST Splitter</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Hanken+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0d0e11; --bg2:#111319; --panel:#15171f; --panel2:#1a1d27;
    --line:#262a36; --line2:#323848;
    --ink:#e9ebf2; --ink-dim:#9aa0b3; --ink-faint:#646a7d;
    --amber:#2f9bff; --amber-soft:#8fc6ff; --amber-glow:rgba(47,155,255,.16);
    --steel:#4ad6e0; --red:#ff5d5d;
    --r:14px;
    --mono:'JetBrains Mono',ui-monospace,monospace;
    --body:'Hanken Grotesk',system-ui,sans-serif;
    --disp:'Anton',sans-serif;
  }
  *{box-sizing:border-box}
  body{ background:var(--bg); color:var(--ink); font-family:var(--body); line-height:1.5; padding:20px; }
  .wrap{ max-width:1280px; margin:0 auto; }
  header.top{ display:flex; align-items:center; gap:14px; margin-bottom:20px; border-bottom:1px solid var(--line); padding-bottom:14px; }
  .logo{ font-family:var(--disp); font-size:13px; color:#0d0e11; background:var(--amber); padding:7px 11px; border-radius:7px; }
  h1{ font-family:var(--disp); font-size:28px; text-transform:uppercase; margin:0; }
  textarea{ width:100%; min-height:180px; background:#0a0b0e; border:1px solid var(--line2); border-radius:10px; color:var(--ink); font-family:var(--mono); padding:14px; }
  .btn{ font-family:var(--body); font-weight:600; background:var(--amber); color:#0d0e11; border:0; padding:10px 18px; border-radius:8px; cursor:pointer; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <span class="logo">OST</span>
    <h1>Script → <em>OST</em> Splitter &amp; Cue Sheet Generator</h1>
  </header>
  <div class="card">
    <p>Paste your video script below to automatically split narration from On-Screen Text (OST) cues and graphic prompts.</p>
    <textarea placeholder="Paste full script package here..."></textarea>
    <br><br>
    <button class="btn">⚡ Split Script &amp; Generate Cues</button>
  </div>
</div>
</body>
</html>
